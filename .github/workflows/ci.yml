name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm test
      # E2E specs need the real API and its worker, so they run locally (`pnpm test:e2e`), not here.
      - run: pnpm build
